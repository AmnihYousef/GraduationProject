<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecureShare | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body class="auth-bg">

<div class="container vh-100 d-flex align-items-center">
    <div class="row w-100 shadow rounded overflow-hidden">

        <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center auth-illustration">
            <img src="{{ url_for('static', filename='images/locked.png') }}" width="280">
        </div>

        <div class="col-md-6 bg-white p-5">
            <h3 class="mb-4 text-center text-primary fw-bold">SecureShare</h3>

            <form method="POST">
                <input type="email" name="email" class="form-control form-control-lg mb-3" placeholder="Email" required>
                <input type="password" name="password" class="form-control form-control-lg mb-3" placeholder="Password" required>

                <button class="btn btn-primary w-100 btn-lg">
                    Login
                </button>

                <div class="text-center mt-3">
                    <a href="/register">Create account</a>
                </div>
            </form>

            {% if error %}
            <div class="alert alert-danger mt-3">
                {{ error }}
            </div>
            {% endif %}
        </div>

    </div>
</div>

</body>
</html>
