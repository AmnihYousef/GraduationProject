<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecureShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="d-flex">
    <!-- Sidebar -->
    <aside class="bg-white border-end vh-100 p-3" style="width: 240px;">
        <h5 class="fw-bold text-primary mb-4">
            <i class="bi bi-shield-lock"></i> SecureShare
        </h5>

        <ul class="nav flex-column gap-1">
            <li class="nav-item">
                <a href="/dashboard" class="nav-link text-dark">
                    <i class="bi bi-house"></i> Home
                </a>
            </li>

            <li class="nav-item">
                <a href="/upload" class="nav-link text-dark">
                    <i class="bi bi-upload"></i> Upload
                </a>
            </li>

            <li class="nav-item">
                <a href="/settings" class="nav-link text-dark">
                    <i class="bi bi-gear"></i> Settings
                </a>
            </li>
        </ul>

        <hr>

        <a href="/logout" class="nav-link text-danger">
          Logout
        </a>

    </aside>

    <!-- Main content -->
    <main class="flex-grow-1 p-4">
        {% block content %}{% endblock %}
    </main>
</div>

</body>
</html>
