<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecureShare | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body class="auth-bg">

<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow p-5" style="width: 420px;">
        <h3 class="text-center text-primary fw-bold mb-4">Create Account</h3>

        <form method="POST">
            <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>

            <button class="btn btn-primary w-100">
                Register
            </button>
        </form>

{% if rules %}
<div class="mt-3">
    <small>Password strength:</small>
    <ul class="small">
        <li class="{{ 'text-success' if rules.length else 'text-danger' }}">
            At least 8 characters
        </li>
        <li class="{{ 'text-success' if rules.uppercase else 'text-danger' }}">
            Uppercase letter
        </li>
        <li class="{{ 'text-success' if rules.lowercase else 'text-danger' }}">
            Lowercase letter
        </li>
        <li class="{{ 'text-success' if rules.digit else 'text-danger' }}">
            Number
        </li>
        <li class="{{ 'text-success' if rules.special else 'text-danger' }}">
            Special character
        </li>
    </ul>
</div>
{% endif %}

{% if error %}
<div class="alert alert-danger mt-3">
    {{ error }}
</div>
{% endif %}

        <div class="text-center mt-3">
            <a href="/">Back to login</a>
        </div>
    </div>
</div>

</body>
</html>
