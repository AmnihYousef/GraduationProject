{% extends "layout.html" %}

{% block content %}
<h3>Settings</h3>

<ul class="nav nav-tabs mt-4">
    <li class="nav-item">
        <a class="nav-link active">Account</a>
    </li>
    <li class="nav-item">
        <a class="nav-link">Security</a>
    </li>
    <li class="nav-item">
        <a class="nav-link">Notifications</a>
    </li>
</ul>

<div class="card p-4 mt-3">
    <h5>Security</h5>

    <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox">
        <label class="form-check-label">
            Enable Two-Factor Authentication
        </label>
    </div>

    <hr>

    <h6>Change Password</h6>
    <input class="form-control mb-2" placeholder="Current password">
    <input class="form-control mb-2" placeholder="New password">
    <button class="btn btn-primary">Update Password</button>
</div>
{% endblock %}
